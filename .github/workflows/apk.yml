name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Pruebas del modulo core
        run: ./gradlew :core:test

      - name: Compilar APK
        run: |
          ./gradlew :app:assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk smcft.apk

      - name: Publicar el APK para descargarlo desde el celular
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk
          name: SMCFT - APK para el celular
          prerelease: true
          files: smcft.apk
